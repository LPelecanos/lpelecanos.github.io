<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d">
<title id="t">Offshore wind natural-frequency shift due to pile soil gapping</title><desc id="d">The predicted natural frequency changed from 0.338 hertz without gapping to 0.327 hertz with gapping, close to a 1P limit at 0.3255 hertz. The modelled gap depth was approximately 9 metres, around 0.30 of the embedded pile length.</desc>
<rect width="760" height="420" rx="28" fill="#fbfaf7"/>
<text x="52" y="54" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" fill="#10202d">Offshore wind monopile · gapping changes system dynamics</text>
<text x="52" y="81" font-family="Inter,Arial,sans-serif" font-size="13" fill="#68747d">Kentish Flats case study · reported frequencies</text>
<rect x="85" y="129" width="590" height="86" rx="18" fill="#eef2f2"/>
<line x1="112" y1="172" x2="648" y2="172" stroke="#8fa0a8" stroke-width="3"/>
<g font-family="Inter,Arial,sans-serif" font-size="11" fill="#68747d" text-anchor="middle">
<text x="112" y="198">0.320</text><text x="246" y="198">0.325</text><text x="380" y="198">0.330</text><text x="514" y="198">0.335</text><text x="648" y="198">0.340 Hz</text>
</g>
<g>
  <line x1="260" y1="134" x2="260" y2="210" stroke="#89969e" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="260" cy="172" r="8" fill="#89969e"/><text x="260" y="125" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#68747d">1P limit</text><text x="260" y="228" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#68747d">0.3255</text>
  <line x1="300" y1="130" x2="300" y2="214" stroke="#b36b32" stroke-width="3"/>
  <circle cx="300" cy="172" r="9" fill="#b36b32"/><text x="300" y="122" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#b36b32">with gapping</text><text x="300" y="231" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#b36b32">0.327</text>
  <line x1="595" y1="130" x2="595" y2="214" stroke="#0b2f4b" stroke-width="3"/>
  <circle cx="595" cy="172" r="9" fill="#0b2f4b"/><text x="595" y="122" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#0b2f4b">without gapping</text><text x="595" y="231" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#0b2f4b">0.338</text>
</g>
<path d="M306 277 C366 249 523 249 585 277" fill="none" stroke="#b36b32" stroke-width="2.5"/>
<path d="M306 277 l15 -8 l-3 15 z M585 277 l-15 -8 l3 15 z" fill="#b36b32"/>
<text x="446" y="265" text-anchor="middle" font-family="Georgia,serif" font-size="30" font-weight="700" fill="#b36b32">≈4%</text>
<text x="446" y="288" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#68747d">frequency reduction reported</text>
<g transform="translate(92,320)">
<rect x="0" y="0" width="255" height="58" rx="14" fill="#0b2f4b"/><text x="20" y="24" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="800" fill="#e9d6c3">MODELLED GAP DEPTH</text><text x="20" y="46" font-family="Georgia,serif" font-size="24" fill="#fff">≈ 9 m</text>
<rect x="275" y="0" width="295" height="58" rx="14" fill="#f2e5da"/><text x="295" y="24" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="800" fill="#9c5b29">RELATIVE EMBEDMENT</text><text x="295" y="46" font-family="Georgia,serif" font-size="24" fill="#10202d">≈ 0.30 L<tspan baseline-shift="sub" font-size="15">p</tspan></text>
</g>
</svg>
