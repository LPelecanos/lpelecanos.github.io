<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d">
<title id="t">Qualitative trade-offs among structural optimisation algorithms</title><desc id="d">Within a common Python finite element framework, derivative free optimisation was rapid and consistent with low overhead, particle swarm optimisation converged quickly to high quality solutions, and the genetic algorithm offered strong adaptability at higher computational cost.</desc>
<rect width="760" height="420" rx="28" fill="#fbfaf7"/>
<text x="52" y="54" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" fill="#10202d">Structural optimisation · same problem, different algorithms</text>
<text x="52" y="81" font-family="Inter,Arial,sans-serif" font-size="13" fill="#68747d">Unified Python/FE framework · Engineering Computations (2026)</text>
<g transform="translate(60,124)" font-family="Inter,Arial,sans-serif">
  <text x="270" y="0" font-size="12" font-weight="800" fill="#68747d">Speed / convergence</text><text x="425" y="0" font-size="12" font-weight="800" fill="#68747d">Solution quality</text><text x="570" y="0" font-size="12" font-weight="800" fill="#68747d">Computational burden</text>
  <g transform="translate(0,36)"><circle cx="42" cy="33" r="30" fill="#0b2f4b"/><text x="42" y="40" text-anchor="middle" font-size="16" font-weight="900" fill="#fff">DFO</text><text x="90" y="30" font-size="13" font-weight="800" fill="#10202d">rapid, consistent</text><text x="90" y="50" font-size="11" fill="#68747d">minimal overhead</text><rect x="270" y="21" width="120" height="18" rx="9" fill="#0b2f4b"/><rect x="425" y="21" width="102" height="18" rx="9" fill="#7390a1"/><rect x="570" y="21" width="48" height="18" rx="9" fill="#b36b32"/></g>
