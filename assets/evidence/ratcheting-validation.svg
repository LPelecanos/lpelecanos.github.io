<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d">
<title id="t">Long-term cyclic ratcheting validation</title><desc id="d">The Winkler ratcheting model was validated against 17 cyclic load tests from five experimental set-ups, extending to one hundred thousand cycles, with a single ratcheting parameter alpha r equal to 0.75 providing a useful first prediction.</desc>
<rect width="760" height="420" rx="28" fill="#fbfaf7"/>
<text x="52" y="54" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" fill="#10202d">Long-term cyclic response · validation depth</text>
<text x="52" y="81" font-family="Inter,Arial,sans-serif" font-size="13" fill="#68747d">Monopile ratcheting model · Ocean Engineering</text>
<g transform="translate(58,126)">
  <rect width="190" height="112" rx="18" fill="#0b2f4b"/><text x="24" y="44" font-family="Georgia,serif" font-size="42" fill="#fff">17</text><text x="24" y="72" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800" fill="#e9d6c3">CYCLIC LOAD TESTS</text><text x="24" y="93" font-family="Inter,Arial,sans-serif" font-size="12" fill="#c8d4db">single + multi-amplitude</text>
  <rect x="208" width="190" height="112" rx="18" fill="#f2e5da"/><text x="232" y="44" font-family="Georgia,serif" font-size="42" fill="#10202d">5</text><text x="232" y="72" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800" fill="#9c5b29">EXPERIMENTAL SET-UPS</text><text x="232" y="93" font-family="Inter,Arial,sans-serif" font-size="12" fill="#68747d">small + full scale datasets</text>
  <rect x="416" width="238" height="112" rx="18" fill="#eef2f2"/><text x="440" y="44" font-family="Georgia,serif" font-size="42" fill="#0b2f4b">10<tspan baseline-shift="super" font-size="23">5</tspan></text><text x="440" y="72" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800" fill="#0b2f4b">CYCLES</text><text x="440" y="93" font-family="Inter,Arial,sans-serif" font-size="12" fill="#68747d">long-term validation horizon</text>
</g>
<g transform="translate(72,292)">
  <text x="0" y="0" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="800" fill="#10202d">Validated cyclic horizon</text>
  <line x1="0" y1="40" x2="590" y2="40" stroke="#0b2f4b" stroke-width="4"/>
  <g fill="#0b2f4b"><circle cx="0" cy="40" r="6"/><circle cx="118" cy="40" r="6"/><circle cx="236" cy="40" r="6"/><circle cx="354" cy="40" r="6"/><circle cx="472" cy="40" r="6"/><circle cx="590" cy="40" r="9"/></g>
  <g font-family="Inter,Arial,sans-serif" font-size="11" fill="#68747d" text-anchor="middle"><text x="0" y="64">1</text><text x="118" y="64">10</text><text x="236" y="64">10²</text><text x="354" y="64">10³</text><text x="472" y="64">10⁴</text><text x="590" y="64">10⁵</text></g>
  <rect x="420" y="-6" width="170" height="26" rx="13" fill="#f2e5da"/><text x="505" y="11" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#9c5b29">α<tspan baseline-shift="sub" font-size="8">r</tspan> = 0.75 useful first estimate</text>
</g>
</svg>
