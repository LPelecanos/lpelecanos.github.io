  <text x="275" y="25" font-family="Inter,Arial,sans-serif" font-size="16" fill="#9aacb4">→</text>
  <rect x="300" y="0" width="105" height="38" rx="19" fill="#f2e5da"/><text x="352" y="24" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#9c5b29">INFER</text>
  <text x="425" y="25" font-family="Inter,Arial,sans-serif" font-size="16" fill="#9aacb4">→</text>
