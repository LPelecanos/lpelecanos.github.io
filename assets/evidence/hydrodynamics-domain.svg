<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d">
<title id="t">Hydrodynamic model domain sensitivity</title><desc id="d">Reservoir length ratios below five were reported to differ significantly from the longest-domain solution; ratios five and above were reasonably close, with L over H equals fifteen treated as the most accurate reference.</desc>
<rect width="760" height="420" rx="28" fill="#fbfaf7"/>
<text x="52" y="54" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" fill="#10202d">Hydrodynamic pressure modelling · domain sensitivity</text>
<text x="52" y="81" font-family="Inter,Arial,sans-serif" font-size="13" fill="#68747d">Random excitation · stiff vertical dam · reported convergence behaviour</text>
<line x1="68" y1="245" x2="696" y2="245" stroke="#b9c3c7" stroke-width="2"/>
<text x="52" y="286" font-family="Inter,Arial,sans-serif" font-size="12" fill="#68747d">Reservoir length ratio, L/H</text>
<rect x="68" y="151" width="275" height="38" rx="19" fill="#f2e5da"/>
<text x="205" y="175" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="800" fill="#9c5b29">boundary influence significant</text>
<rect x="344" y="151" width="352" height="38" rx="19" fill="#e9f0f1"/>
<text x="520" y="175" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="800" fill="#0b2f4b">reasonably close to long-domain solution</text>
<g font-family="Inter,Arial,sans-serif" font-size="12" text-anchor="middle">
  <g fill="#b36b32" stroke="#b36b32">
    <circle cx="92" cy="245" r="8"/><circle cx="142" cy="245" r="8"/><circle cx="207" cy="245" r="8"/><circle cx="271" cy="245" r="8"/><circle cx="326" cy="245" r="8"/>
  </g>
  <g fill="#0b2f4b" stroke="#0b2f4b">
    <circle cx="376" cy="245" r="8"/><circle cx="471" cy="245" r="8"/><circle cx="548" cy="245" r="8"/><circle cx="610" cy="245" r="8"/><circle cx="680" cy="245" r="10"/>
  </g>
  <g fill="#56636c">
    <text x="92" y="270">0.5</text><text x="142" y="270">1</text><text x="207" y="270">2</text><text x="271" y="270">3</text><text x="326" y="270">4</text><text x="376" y="270">5</text><text x="471" y="270">8</text><text x="548" y="270">10</text><text x="610" y="270">12</text><text x="680" y="270">15</text>
  </g>
</g>
<line x1="680" y1="203" x2="680" y2="238" stroke="#0b2f4b" stroke-width="2" stroke-dasharray="4 4"/>
<text x="680" y="198" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#0b2f4b">reference</text>
<g transform="translate(52,320)">
  <rect width="656" height="54" rx="14" fill="#0b2f4b"/>
  <text x="20" y="22" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#e9d6c3">VALIDATION SPACE</text>
  <text x="20" y="41" font-family="Inter,Arial,sans-serif" font-size="12" fill="#ffffff">stiff + flexible · vertical + sloping faces · ramp + harmonic + random excitation</text>
</g>
</svg>
